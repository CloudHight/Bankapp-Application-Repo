spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    # CT-62: Flyway changes the tables with its own user (bankapp_migrate).
    # The app connects as bankapp_app, which can read and change data but not tables.
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

server:
  forward-headers-strategy: framework
