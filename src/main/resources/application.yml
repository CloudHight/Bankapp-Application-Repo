spring:
  application:
    name: bankapp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  # Actuator runs on its own port so the load balancer's public listener never serves it
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        # "prometheus" removed: metrics go to New Relic over OTLP, and the
        # prometheus endpoint needs micrometer-registry-prometheus, which is not added
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true            # adds /actuator/health/liveness and /readiness
      show-details: when-authorized
      group:
        liveness:
          include: livenessState          # alive only: a database outage must NOT restart the app
        readiness:
          include: readinessState,db      # ready only when it can serve requests
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  info:
    env:
      enabled: true

# Credentials for the protected actuator endpoints (metrics, info).
# On the servers they come from Secrets Manager through /etc/bankapp/actuator.env.
# No default password here on purpose: the app will not start without one (see the dev profile below).
bankapp:
  actuator:
    username: ${BANKAPP_ACTUATOR_USERNAME:actuator}
    password: ${BANKAPP_ACTUATOR_PASSWORD}

info:
  app:
    name: ${spring.application.name}
    description: REST banking application

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:bankapp;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
  flyway:
    enabled: false

# Local development only
bankapp:
  actuator:
    password: ${BANKAPP_ACTUATOR_PASSWORD:dev-only-password}
